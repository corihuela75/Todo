name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama a desplegar (p.ej. develop o main)'
        required: true
        default: 'develop'
      environment:
        description: 'Entorno de despliegue (p.ej. staging, production)'
        required: true
        default: 'staging'

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  BACKEND_IMAGE: ${{ github.repository }}-backend
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-test:
    name: Build, Test y Push a GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias Backend
        run: npm install --prefix ./Todo-app-back

      - name: Instalar dependencias Frontend
        run: npm install --prefix ./Todo-app

      - name: Test Backend
        run: npm test --prefix ./Todo-app-back

      - name: Test Frontend
        run: npm run test:ci --prefix ./Todo-app

      - name: Build Frontend
        run: npm run build --prefix ./Todo-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      ##########################################
      # METADATA: Etiquetas para backend / frontend
      ##########################################

      - name: Metadata Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.target_branch || github.ref_name }}-latest
            type=sha,format=short

      - name: Metadata Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.target_branch || github.ref_name }}-latest
            type=sha,format=short

      ##########################################
      # BUILD + PUSH BACKEND
      ##########################################

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Todo-app-back
          push: true
          file: ./Todo-app-back/Dockerfile
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      ##########################################
      # BUILD + PUSH FRONTEND
      ##########################################

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Todo-app
          push: true
          file: ./Todo-app/Dockerfile
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  ###############################################################
  # JOB DE DESPLIEGUE EN RENDER SOLO AL HACER PUSH A MAIN
  ###############################################################
  deploy:
    name: Despliegue a Render
    runs-on: ubuntu-latest
    needs: build-and-test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Despliegue Automático a Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Disparando despliegue en Render..."
          curl -X POST "${{ env.RENDER_DEPLOY_HOOK }}"
          echo "Despliegue enviado con éxito."
