name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama a desplegar (p.ej. develop o main)'
        required: true
        default: 'develop'
      environment:
        description: 'Entorno de despliegue (p.ej. staging, production)'
        required: true
        default: 'staging'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Integración y Construcción (Sube la imagen a GHCR)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: |
          npm install --prefix ./backend
          npm install --prefix ./frontend

      - name: Correr Tests Backend
        run: npm test --prefix ./backend

      - name: Correr Tests Frontend
        run: npm test --prefix ./frontend

      - name: Construir Frontend
        run: npm run build --prefix ./frontend

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extraer metadatos Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.target_branch || github.ref_name }}-latest
            type=sha,format=short

      - name: Build y Push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue a Render
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Despliegue Automático a Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Disparando despliegue en Render..."
          curl -X POST "${{ env.RENDER_DEPLOY_HOOK }}"
          echo "Despliegue enviado con éxito."
